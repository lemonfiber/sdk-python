# The lint and format configuration for this package, its tests and its scripts.
#
# The package is a client library every consumer runs, so it is held to every rule
# ruff has rather than to the organisation's floor alone: `ALL` selects them, and
# the floor's own rules are named beside it so `check_shared_files.py` finds each
# one selected. Nothing the floor keeps is ignored here.
#
# `src/lemonfiber/_generated/` is formatted and not linted. It is rewritten whole
# from the vendored contract by `just generate`, `contract-check` fails on any
# difference, and a finding there could only be fixed in the generator.
target-version = "py314"
line-length = 110

# A byte-identical copy of the spec's shared gate, linted where it is maintained.
extend-exclude = ["scripts/no_open_codeql_alert.py"]

[lint]
select = ["ALL", "E", "W", "F", "B", "I", "SIM", "UP", "RUF", "EXE", "FURB", "ISC"]

ignore = [
    # The organisation's floor ignores these, and so does this package. Prose
    # quoted from the contract uses typographic dashes and quotes deliberately.
    "RUF001",
    "RUF002",
    "RUF003",
    "E501",
]

exclude = ["src/lemonfiber/_generated/**"]

[lint.per-file-ignores]
# `assert` is how pytest states what it checks, a test names the status or count
# it expects as the number itself, and a test's name is its description.
"tests/**" = ["S101", "PLR2004", "D103"]
# The one module that hands the generated shapes on whole: the generated package's
# own `__all__` is the list, so there is no second copy of it here to fall behind.
"src/lemonfiber/contract.py" = ["F403"]
# The one subprocess the generator starts: the formatter the lockfile pins,
# given only the files this run of the generator wrote.
"scripts/contract_generator/formatting.py" = ["S603"]
# Git, as the runner's `PATH` has it, asked about the commits of the checkout
# it runs in: what a change touches is the question this script answers.
"scripts/the_code_a_change_touches.py" = ["S603", "S607"]

[lint.pydocstyle]
convention = "pep257"

[format]
docstring-code-format = true
