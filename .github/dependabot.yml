# Dependency updates (spec ADR-0016).
#
# One file per repo. Dependabot cannot extend a shared preset, so this is copied
# rather than inherited and kept alike by review.
#
# The pull requests it opens cite nothing — Dependabot composes its own commit
# message and offers no way to add a `Spec:` trailer. `spec_check.py` supplies
# `GOV-R12` for a pull request GitHub says `dependabot[bot]` opened (Q-R55).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 3
    # lemonfiber/spec's workflows are moved by the release train's one rolling
    # bump pull request (OPS-R85), never by this updater.
    ignore:
      - dependency-name: "lemonfiber/spec*"
    groups:
      actions:
        patterns: ["*"]
        # Majors are left out, so each arrives on its own carrying `major`.
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 3
    groups:
      # The tooling lands together, and before the wildcard claims it.
      quality-tooling:
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]
      runtime:
        patterns: ["*"]
        update-types: ["minor", "patch"]
