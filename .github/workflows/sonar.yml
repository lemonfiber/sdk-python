# Scan this repository with SonarQube Cloud and gate its pull requests on zero
# new issues.
name: sonar
on:
  pull_request:
  # Main's analysis is what every pull request's new code is measured against.
  push:
    branches: [main]
# Read-only for the workflow. The one job that writes — the gate, which posts its
# verdict on the pull request — asks for that itself.
permissions:
  contents: read
# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Whole history, so the scanner can tell which lines a pull request changed
      # and blame each one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install exactly what the lockfile says
        run: uv sync --locked
      # The same recipe the `tests and coverage` job runs, so the coverage the scan
      # reports is the coverage the gate held to 100%.
      - name: The suite, with 100% line and branch coverage
        run: uv run just coverage
      # A Dependabot run reads secrets from the Dependabot store, and `SONAR_TOKEN`
      # is only in the Actions store, so the scan is skipped there rather than
      # failing on an empty token. The suite above needs no token and runs either
      # way.
      #
      # Keyed on who opened the pull request, which is what selects the secret
      # store, and not on `github.triggering_actor`, which becomes whoever pressed
      # re-run. A push to main carries no pull request, so the scan runs there.
      - name: SonarQube Cloud scan
        id: scan
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Runs when the scan failed, and says whether the host was answering: a
      # scanner that cannot reach SonarCloud fails with a trace that reads like a
      # finding. It changes nothing about the run; the scan still failed and the
      # check is red.
      - name: Whether SonarCloud was answering
        if: always() && steps.scan.outcome == 'failure'
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            https://sonarcloud.io/api/system/status 2>/dev/null || echo "000")

          # 000 is curl reaching nothing at all, which is the same news as a 5xx.
          case "$code" in
          5?? | 000)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was unavailable rather than this pull request being at fault. The suite ran above and had to reach 100% coverage either way. Re-run this job once sonarcloud.io is answering — no analysis gated this run."
            ;;
          *)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was reachable and the failure is in this run rather than an outage. Read the scanner output above. No analysis gated this run."
            ;;
          esac

          echo "::notice::${said}"
          printf '### Why the SonarCloud scan failed\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"
      # A skipped step is missing from the log, which reads the same as one that
      # ran and found nothing, so the skip is said under its own name.
      - name: Why the scan was skipped
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          said="The SonarCloud scan was skipped: ${AUTHOR} opened this pull request, and a Dependabot run reads secrets from the Dependabot store rather than the Actions store, so SONAR_TOKEN is empty here and the scanner could only fail on it. The suite ran above and still had to reach 100% coverage. No analysis was produced, so none gated this run."
          echo "::notice::${said}"
          printf '### SonarCloud scan skipped\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

  # Open SonarCloud issues must be zero, and the free plan's own quality gate
  # cannot be configured to that standard (Q-R64). The shared reusable in spec
  # holds the count instead, so every repository gates identically: it reads the
  # scan's summary, fails on any new issue, and posts a sticky verdict on the pull
  # request. A summary that never arrived, or one it cannot read, warns rather
  # than blocks.
  gate:
    needs: sonar
    # Runs whatever the scan did: `needs` alone would drop this job when the scan
    # fails, and a required check that never reports blocks a pull request with no
    # line saying why. A failed scan still leaves `sonar` red. `!cancelled()`
    # rather than `always()`, because a cancelled run is somebody pressing stop.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@999f97e9414290f029391d5d541087b8a6d23bdf # v1.0.29
    with:
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
