# Gate this repo's PRs on zero new SonarCloud issues.
#
# The scan is SonarCloud Automatic Analysis against `lemonfiber_sdk-python`;
# there is no scan job here. This reads the summary that analysis posts and
# enforces the standard the free plan's own quality gate cannot (Q-R64),
# through the shared reusable in spec so every repo gates identically.
name: sonar
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  gate:
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@999f97e9414290f029391d5d541087b8a6d23bdf # v1.0.29
    with:
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
