# Scan this repository with SonarQube Cloud and gate its pull requests on zero
# new issues.
name: sonar
on:
  pull_request:
  # Main's analysis is what every pull request's new code is measured against.
  push:
    branches: [main]
# Every `uv` a recipe runs inside these steps syncs as the steps do: from the
# lockfile and nothing else, building no source distribution.
env:
  UV_LOCKED: "1"
  UV_NO_BUILD: "1"

# Read-only for the workflow. The one job that writes — the gate, which posts its
# verdict on the pull request — asks for that itself.
permissions:
  contents: read
# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
# The token never shares a runner with code the repository installs. `coverage`
# installs every locked dependency and runs the suite, and a step on the same
# runner can rewrite what a later step runs — the tool cache, a downloaded
# action, `PATH` through `$GITHUB_PATH` — so it holds no secret and hands on only
# its report. `sonar` checks the tree out, reads that report and runs the
# scanner, and runs nothing from the repository. Only `sonar` and the gate are
# given `SONAR_TOKEN`, which is why a Dependabot run may be given it too.
# The report is read as data and nothing else: it lands outside the workspace,
# is refused unless it is the one regular file expected, and reaches the scanner
# as an argument, so it can overwrite nothing the scanner reads and is never run.
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install exactly what the lockfile says
        run: uv sync --locked --no-build
      # The same recipe the `tests and coverage` job runs, so the coverage the scan
      # reports is the coverage the gate held to 100%.
      - name: The suite, with 100% line and branch coverage
        run: uv run --locked --no-build just coverage
      # The report names its source roots by absolute path, which is the same path
      # in the scan job's checkout: both run in this repository's workspace.
      - name: Hand the report to the scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1
          if-no-files-found: error

  sonar:
    needs: coverage
    # Runs whatever coverage did, and fails at once when it failed: a skipped job
    # reports as passing, so `sonar` would read green over a suite that did not
    # reach 100%. `!cancelled()` rather than `always()`, because a cancelled run is
    # somebody pressing stop.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: The coverage gate held
        env:
          RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::The coverage job finished with ${RESULT}, so there is no report to scan."
            exit 1
          fi
      # Whole history, so the scanner can tell which lines a pull request changed
      # and blame each one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Into the runner's temporary directory, never the workspace: the artifact
      # comes from the job that ran the repository's code.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
      # What was found is reduced to one line of plain characters before it is
      # printed, so a file name cannot read as a workflow command.
      - name: The report is the one file expected
        env:
          DIR: ${{ runner.temp }}/coverage
          EXPECTED: coverage.xml
        run: |
          set -euo pipefail
          found=$(find "$DIR" -mindepth 1 -printf '%P:%y,' | tr -c 'A-Za-z0-9._:,/-' '?')
          if [ "$found" != "${EXPECTED}:f," ]; then
            echo "::error::The coverage artifact has to hold ${EXPECTED} as a regular file and nothing else. It held (name:type, f file, l link, d directory): ${found:-nothing}"
            exit 1
          fi
      # A pull request from a fork reads no secret store, and a Dependabot run
      # reads the Dependabot one, so a pull request can arrive without a token.
      - name: Whether a token reached this run
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # A pull request without a token skips the scan rather than failing on an
      # empty one. A push to main scans whatever it was given, so a missing token
      # there fails here, where it is named, and main's analysis is what every pull
      # request is measured against.
      - name: SonarQube Cloud scan
        id: scan
        if: github.event_name != 'pull_request' || steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # The report's path is given here rather than in `sonar-project.properties`.
        with:
          args: -Dsonar.python.coverage.reportPaths=${{ runner.temp }}/coverage/coverage.xml
      # Runs when the scan failed, and says whether the host was answering: a
      # scanner that cannot reach SonarCloud fails with a trace that reads like a
      # finding. It changes nothing about the run; the scan still failed and the
      # check is red.
      - name: Whether SonarCloud was answering
        if: always() && steps.scan.outcome == 'failure'
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            https://sonarcloud.io/api/system/status 2>/dev/null || echo "000")

          # 000 is curl reaching nothing at all, which is the same news as a 5xx.
          case "$code" in
          5?? | 000)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was unavailable rather than this pull request being at fault. The suite ran in its own job and had to reach 100% coverage either way. Re-run this job once sonarcloud.io is answering — no analysis gated this run."
            ;;
          *)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was reachable and the failure is in this run rather than an outage. Read the scanner output above. No analysis gated this run."
            ;;
          esac

          echo "::notice::${said}"
          printf '### Why the SonarCloud scan failed\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"
      # A skipped step is missing from the log, which reads the same as one that
      # ran and found nothing, so the skip is said under its own name.
      - name: Why the scan was skipped
        if: github.event_name == 'pull_request' && steps.token.outputs.present != 'true'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          said="The SonarCloud scan was skipped: no SONAR_TOKEN reached this run of a pull request opened by ${AUTHOR}. A pull request from a fork reads no secret store, and a Dependabot run reads the Dependabot one. The suite ran in its own job and still had to reach 100% coverage. No analysis was produced, so none gated this run."
          echo "::notice::${said}"
          printf '### SonarCloud scan skipped\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

  # Open SonarCloud issues must be zero, and the free plan's own quality gate
  # cannot be configured to that standard (Q-R64). The shared reusable in spec
  # holds the count instead, so every repository gates identically: it reads the
  # scan's summary, fails on any new issue, and posts a sticky verdict on the pull
  # request. A summary that never arrived, or one it cannot read, warns rather
  # than blocks.
  gate:
    needs: sonar
    # Runs whatever the scan did: `needs` alone would drop this job when the scan
    # fails, and a required check that never reports blocks a pull request with no
    # line saying why. A failed scan still leaves `sonar` red. `!cancelled()`
    # rather than `always()`, because a cancelled run is somebody pressing stop.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@92ec12769c3fdebc6063a839e9ea7c8bc23e6d3d # v1.0.31
    with:
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
