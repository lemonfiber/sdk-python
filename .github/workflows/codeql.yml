# CodeQL static analysis (Q-R53).
#
# Two surfaces. `python` is the client this repository is: the code every
# consumer that vendors it ends up running. `actions` is the workflows, which
# call reusable workflows with a token and are where injection and
# supply-chain flaws live.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 2"
permissions:
  contents: read
# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        with:
          languages: ${{ matrix.language }}
      # No build step: neither language is compiled. No `category:` either —
      # with a matrix, GitHub builds one that names its language, which is what
      # the gate below compares against.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3

  # Whether an open alert stands against what this branch proposes. The check
  # GitHub raises beside the analysis is neutral on every pull request here and
  # gates nothing.
  #
  # `!cancelled()` rather than `needs:` alone: a failed dependency makes a job
  # vanish, and a skipped required check satisfies branch protection, so the
  # gate would be absent exactly when the analysis went wrong. It refuses a
  # commit it has no analysis of, by language, rather than passing an empty list.
  alerts:
    needs: analyze
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: read
    uses: lemonfiber/spec/.github/workflows/codeql-alerts.yml@0c90255bca15d3135295deafb63c24f04771300b # v1.0.71
    with:
      analysis: ${{ needs.analyze.result }}
