[project]
name = "lemonfiber"
version = "0.0.0"
description = "The Python client for lemonfiber's web API."
readme = "README.md"
license = "LicenseRef-Hippocratic-3.0"
license-files = ["LICENSE"]
authors = [{ name = "NightWorksIO", email = "info@nightworks.io" }]
requires-python = ">=3.14"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14",
    "urllib3>=2.5",
]

[project.urls]
Repository = "https://github.com/lemonfiber/sdk-python"
Specification = "https://github.com/lemonfiber/spec/blob/main/30-repos/sdk-python.md"

[dependency-groups]
dev = [
    "git-cliff>=2.14",
    "griffe>=2.3",
    "mutmut>=3.8",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "rust-just>=1.58",
    "trustme>=1.2",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11"
# The package is read from `src/` where it stands rather than installed, so a
# sync builds nothing: every dependency comes from the wheel `uv.lock` pins,
# and CI syncs with `--no-build`, which refuses anything that would run a
# setup script. `uv build` still builds the package.
package = false

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["scripts/no_open_codeql_alert.py"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
enableTypeIgnoreComments = false
reportImplicitOverride = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
# The scripts are measured as the package is: SonarQube Cloud analyses both.
# `no_open_codeql_alert.py` is the spec's shared gate, byte-identical to its
# home copy, and measured and analysed there.
source = ["src/lemonfiber", "scripts"]
omit = ["scripts/no_open_codeql_alert.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
# A script's entry point hands the process its exit code. What it calls is
# measured; the call from the interpreter is not something a test makes.
exclude_also = ['if __name__ == "__main__":']

[tool.mutmut]
source_paths = ["src/"]
do_not_mutate = ["src/lemonfiber/_generated/*"]
# The generator's tests run the generator, which formats what it writes as
# `ruff.toml` configures the formatter.
also_copy = ["contract/", "scripts/", "ruff.toml"]
# The architecture tests read the tree as files, and under mutation the tree is
# mutmut's rewrite of it; they kill no mutant and are run by `ci` instead.
pytest_add_cli_args_test_selection = ["tests/", "--ignore=tests/test_architecture.py"]
# `typing.cast` has no effect at run time, so a mutant of its type argument is one
# no test could tell apart. A line holding a cast holds nothing else to mutate.
do_not_mutate_patterns = ["\\bcast\\("]

[tool.lemonfiber.mutation]
# The share of mutants the suite must tell apart from the code, as a percentage.
minimum-score = 100

[tool.lemonfiber.backward-compatibility]
# Each break of the public surface a change makes on purpose, as the check
# names it: the symbol, the kind of break, and why. A listed break passes for
# that symbol and that kind alone, where a commit since the consumer's pin is
# marked breaking; every other break fails.
accepted = [
  { symbol = "lemonfiber._generated.kinds.plugins.api_kind.PluginPair", kind = "object-changed-kind", reason = "its key `from` is a Python keyword, so the TypedDict is written in its functional form; the shape a value takes is unchanged" },
]

[tool.lemonfiber.line-cap]
# The most lines a file may hold, as the core holds its own. A source file, the
# generated modules included: the generator writes a module that would hold
# more as a package of parts. A test file holds fixtures and every case of one
# thing, and past its cap is the tests for more than one thing.
source = 550
tests = 800
