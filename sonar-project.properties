# Read by the SonarQube Cloud scan `sonar.yml` runs, which analyses the tree the
# suite ran in and reads the coverage report that run wrote.
sonar.projectKey=lemonfiber_sdk-python
sonar.organization=lemonfiber

# `tests/` is the suite, named so the rules Sonar scopes to production code stay
# pointed at `src/` and `scripts/`. A file claimed as both source and test is
# indexed twice and the analysis produces nothing, so `tests/` is also excluded
# from the sources.
sonar.sources=.
sonar.tests=tests
sonar.python.version=3.14

# `src/lemonfiber/_generated/**` is rewritten whole from the vendored contract by
# `just generate`, and `just contract-check` fails on any hand edit, so a finding
# there cannot be fixed where it is reported. `contract/` is the vendored
# artefact itself. `scripts/no_open_codeql_alert.py` is the spec's shared gate,
# byte-identical to its home copy and analysed there.
sonar.exclusions=tests/**,src/lemonfiber/_generated/**,contract/**,scripts/no_open_codeql_alert.py

# Written by `just coverage`, the run that holds the suite to 100% line and
# branch coverage.
sonar.python.coverage.reportPaths=coverage.xml
